name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: WASM build
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=js GOARCH=wasm go build -o /tmp/logpulse.wasm ./cmd/wasm
